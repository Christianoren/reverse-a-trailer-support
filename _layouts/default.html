<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  {% seo %}
  {% if page.schema == "app" %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MobileApplication",
    "name": {{ site.title | jsonify }},
    "description": {{ site.description | jsonify }},
    "applicationCategory": "GameApplication",
    "genre": "Simulation",
    "operatingSystem": "Android, iOS",
    "url": {{ site.url | append: site.baseurl | append: "/" | jsonify }},
    "sameAs": [{{ site.google_play_url | jsonify }}{% unless site.app_store_url contains "TODO" %}, {{ site.app_store_url | jsonify }}{% endunless %}]
  }
  </script>
  {% endif %}
  {% if page.faq %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [{% for item in page.faq %}
      {
        "@type": "Question",
        "name": {{ item.q | jsonify }},
        "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | strip_html | jsonify }} }
      }{% unless forloop.last %},{% endunless %}{% endfor %}
    ]
  }
  </script>
  {% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="{{ '/' | relative_url }}">
        <svg class="brand-icon" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="10" width="14" height="10" rx="2"/><rect x="20" y="8" width="10" height="12" rx="2"/><path d="M16 16h4"/><circle cx="8" cy="23" r="2.5"/><circle cx="25" cy="23" r="2.5"/></svg>
        <span>{{ site.title }}</span>
      </a>
      <nav aria-label="Main">
        <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/support' | relative_url }}"{% if page.url contains "support" %} aria-current="page"{% endif %}>Support</a>
        <a href="{{ '/privacy' | relative_url }}"{% if page.url contains "privacy" %} aria-current="page"{% endif %}>Privacy</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
      <p>
        <a href="{{ site.google_play_url }}" rel="noopener">Google Play</a>
        {% unless site.app_store_url contains "TODO" %}&middot; <a href="{{ site.app_store_url }}" rel="noopener">App Store</a>{% endunless %}
        &middot; <a href="{{ '/support' | relative_url }}">Support</a>
        &middot; <a href="{{ '/privacy' | relative_url }}">Privacy Policy</a>
      </p>
    </div>
  </footer>
</body>
</html>
